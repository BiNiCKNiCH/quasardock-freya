name: windows-build

# Windows-EXE für QuasarDock (Freya/Skia). Der Build läuft NUR hier, weil Skia
# auf einem Windows-Läufer nativ gegen die MSVC-Toolchain gebaut wird — ein
# Cross-Compile von Linux aus ist für diesen Stack nicht praktikabel
# (Begründung: docs/BUILD.md, Abschnitt „Windows-Pfad").

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Tests (Windows)
        run: cargo test --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Release-Build
        run: cargo build --release --locked

      - name: Verify EXE icon resource (.rsrc)
        shell: bash
        run: |
          rustup component add llvm-tools-preview
          EXE=$(pwd)/target/release/quasardock.exe
          echo "EXE-SHA256: $(sha256sum "$EXE" | cut -d' ' -f1)"
          if rust-objdump -x "$EXE" 2>/dev/null | grep -qi "\.rsrc"; then
            echo "OK: .rsrc-Segment mit Ressourcen (Icon) vorhanden"
            rust-objdump -x "$EXE" 2>/dev/null | grep -i "rsrc"
          else
            echo "FEHLER: keine .rsrc-Ressource in der EXE — Icon nicht eingebettet"
            exit 1
          fi

      - name: Portable-ZIP packen
        shell: pwsh
        run: |
          # Portable = EXE plus der beim ersten Start angelegte Data-Ordner bleibt
          # im Programmverzeichnis. Kein Installer, keine Registry, kein AppData.
          # Data/-Skelett wird als leere Struktur mitgeliefert.
          New-Item -ItemType Directory -Force -Path staging/Data/logs | Out-Null
          New-Item -ItemType File -Force -Path staging/Data/logs/.keep | Out-Null
          Copy-Item "target/release/quasardock.exe" staging/
          Copy-Item "app-icon.png" staging/
          Copy-Item "README.md" staging/
          Compress-Archive -Path "staging/*" -DestinationPath "quasardock-windows-x64-portable.zip"

      - name: Prüfen, dass die EXE wirklich da ist
        shell: pwsh
        run: |
          $exe = Get-Item "target/release/quasardock.exe"
          Write-Host ("quasardock.exe: {0} Bytes" -f $exe.Length)
          if ($exe.Length -lt 1MB) { throw "EXE unerwartet klein — Build fehlgeschlagen?" }

      - name: Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: quasardock-windows-x64
          path: |
            quasardock-windows-x64-portable.zip
            target/release/quasardock.exe
          if-no-files-found: error
          retention-days: 90
