[package]
name = "quasardock"
version = "0.1.0"
edition = "2024"
description = "QuasarDock - nativer App-Launcher (Rust + Freya, kein WebView)"
publish = false

[dependencies]
freya = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Icon-Dekodierung (PNG/ICO/BMP) — plattformneutral, keine System-Libs.
image = { version = "0.25", default-features = false, features = ["png", "ico", "bmp"] }
# ICO-Mehrbild-Extraktion (größtes Bild wählen).
ico = "0.4"
# Async-Laufzeit kommt transitiv über Freya (tokio) — keine Direkt-Abhängigkeit nötig.

# Winit (Transitiv über Freya) direkt referenzierbar machen, damit Fenster-Geometrie
# (Position/Größe) und Windows-spezifische Ext rasch nutzbar sind.
winit = "0.30"

# Windows-spezifische Systemintegration (nur beim Windows-Target kompiliert).
[target.'cfg(windows)'.dependencies]
tray-icon = "0.20"
winreg = "0.52"
windows-sys = { version = "0.52", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_SystemServices",
    "Win32_Foundation",
] }

[[bin]]
name = "quasardock"
path = "src/main.rs"
