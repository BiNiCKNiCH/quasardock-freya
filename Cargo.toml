[package]
name = "quasardock"
version = "0.1.0"
edition = "2024"
description = "QuasarDock - nativer App-Launcher (Rust + Freya, kein WebView)"
publish = false

[dependencies]
freya = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "quasardock"
path = "src/main.rs"
